name: Build and Push Docker Image

on:
  push:
    branches:
      - master  # Trigger on push to the master branch (adjust if your default branch is different, e.g., main)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (ensures compatibility for building Docker images)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub using your secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build the Docker image and push it to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # Use the root directory (where Dockerfile is)
          push: true  # Push the image to Docker Hub
          tags: umar0800/simple-python-app:latest  # Use your Docker Hub username and a name for your image
